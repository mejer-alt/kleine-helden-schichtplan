<!DOCTYPE html>
<html lang='de'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Kleine Helden GmbH – Schichtplan</title>
<link href='https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap' rel='stylesheet'>
<style>
:root{--blue:#1da1f2;--blue-dark:#0e7bc4;--blue-light:#e8f6fe;--black:#0a0a0a;--white:#fff;--g50:#f5f7fa;--g100:#eef0f4;--g200:#dde1ea;--g400:#8a92a6;--g600:#4a5168}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--g50);color:var(--black);min-height:100vh;user-select:none}
.header{background:var(--black);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:62px;border-bottom:2px solid var(--blue);position:sticky;top:0;z-index:100}
.header-logo{display:flex;align-items:center;gap:12px}
.header-logo img{height:42px;width:120px;object-fit:contain}
.logo-name{color:var(--white);font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.logo-sub{color:var(--blue);font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
.live-dot{width:7px;height:7px;background:#22c55e;border-radius:50%;margin-left:6px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.4);font-family:'DM Mono',monospace}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#22c55e}
.sync-dot.syncing{background:#f59e0b;animation:blink .8s infinite}
.sync-dot.error{background:#ef4444}
.toolbar{background:var(--white);border-bottom:1px solid var(--g200);padding:10px 1.5rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.day-nav{display:flex;align-items:center;border:1px solid var(--g200);border-radius:8px;overflow:hidden}
.day-nav button{background:var(--white);border:none;padding:7px 13px;cursor:pointer;color:var(--blue);font-size:15px;transition:background .15s}
.day-nav button:hover{background:var(--blue-light)}
.day-label{font-size:13px;font-weight:600;padding:7px 16px;border-left:1px solid var(--g200);border-right:1px solid var(--g200);min-width:215px;text-align:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--g200);background:var(--white);color:var(--g600);font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--g50);color:var(--black);border-color:var(--g400)}
.btn-primary{background:var(--blue);color:var(--white);border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-dark);color:var(--white)}
.btn-dark{background:var(--black);color:var(--white);border-color:var(--black)}
.btn-dark:hover{background:#222;color:var(--white)}
.ml-auto{margin-left:auto}
.hint{font-size:11px;color:var(--g400);padding:5px 1.5rem;background:var(--white);border-bottom:1px solid var(--g100)}
.stats-bar{display:flex;gap:1px;background:var(--g200);border-bottom:1px solid var(--g200)}
.stat{flex:1;background:var(--white);padding:10px 16px;text-align:center}
.stat-num{font-size:20px;font-weight:700;color:var(--blue);font-family:'DM Mono',monospace;line-height:1}
.stat-lbl{font-size:10px;color:var(--g400);font-weight:500;letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
.table-wrap{padding:1.25rem 1.5rem;overflow-x:auto}
.plan-table{border-collapse:separate;border-spacing:0;background:var(--white);border-radius:12px;border:1px solid var(--g200);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(29,161,242,.07);min-width:max-content;width:100%}
.plan-table thead th{background:var(--black);color:rgba(255,255,255,.65);font-size:10px;font-weight:500;font-family:'DM Mono',monospace;padding:9px 5px;text-align:center;border-right:1px solid rgba(255,255,255,.06);min-width:52px}
.th-name{text-align:left!important;padding-left:14px!important;min-width:145px!important;background:#111!important;color:rgba(255,255,255,.4)!important;font-size:9px!important;letter-spacing:.1em!important;text-transform:uppercase!important}
.th-del,.th-sum{min-width:38px!important;background:#111!important;border-right:none!important;color:rgba(255,255,255,.3)!important}
.plan-table tbody tr:not(:last-child) td{border-bottom:1px solid var(--g100)}
.plan-table tbody tr.row-alt td{background-color:#f0f6ff!important}
.plan-table tbody td{border-right:1px solid var(--g100);height:40px;padding:0;vertical-align:middle}
.plan-table tbody td:last-child{border-right:none}
.td-name{background:var(--g50)!important;padding:0 16px!important;font-size:13px;font-weight:700;color:var(--black);border-right:3px solid var(--blue)!important;cursor:default!important;white-space:nowrap;min-width:145px}
.td-del{background:var(--g50)!important;text-align:center;font-size:12px;color:#ccc;cursor:pointer;transition:color .15s;border-left:1px solid var(--g200)!important}
.td-del:hover{color:#ef4444!important}
.td-sum{background:var(--g50)!important;text-align:center;font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:var(--blue);cursor:default!important;border-left:1px solid var(--g200)!important}
.td-slot{cursor:crosshair;padding:3px 2px!important}
.td-slot:hover .slot-empty{background:var(--blue-light)}
.td-slot.drag-hl .slot-empty{background:rgba(29,161,242,.3)!important}
.td-slot.drag-hl .slot-chip{opacity:.6}
.slot-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.slot-chip{display:flex;align-items:center;justify-content:center;width:100%;height:30px;border-radius:8px;font-size:10px;font-weight:800;color:#1a1a1a;letter-spacing:.02em;font-family:'DM Mono',monospace;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.slot-empty{width:100%;height:30px;border-radius:8px;background:transparent;transition:background .1s}
.legend-bar{padding:.75rem 1.5rem 1.5rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.legend-lbl{font-size:10px;color:var(--g400);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--g600);padding:3px 8px 3px 5px;border-radius:20px;border:1px solid var(--g200);background:var(--white)}
.leg-dot{width:8px;height:8px;border-radius:50%}
.leg-del{margin-left:4px;color:rgba(100,100,100,.4);cursor:pointer;font-size:10px;transition:color .15s}
.leg-del:hover{color:#ef4444}
.week-grid{display:flex;gap:0;border-radius:12px;border:1px solid var(--g200);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(29,161,242,.07)}
.week-col{flex:1;min-width:155px;border-right:1px solid var(--g200);background:var(--white)}
.week-col:last-child{border-right:none}
.week-col-today .week-col-hd{background:var(--blue)!important}
.week-col-hd{background:var(--black);padding:10px 10px 8px;border-bottom:1px solid var(--g200)}
.week-col-day{color:var(--white);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.week-col-date{color:rgba(255,255,255,.4);font-size:10px;font-family:'DM Mono',monospace;margin-top:2px}
.week-prof-block{border-bottom:1px solid var(--g100);padding:5px 8px}
.week-prof-block:last-child{border-bottom:none}
.week-prof-name{font-size:10px;font-weight:600;color:var(--g600);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-hours{display:flex;gap:1px;flex-wrap:wrap}
.wh{width:10px;height:18px;border-radius:9px;cursor:default;transition:opacity .1s}
.wh.filled{box-shadow:0 1px 3px rgba(0,0,0,.18)}
.wh.filled:hover{opacity:.75}
.wh.empty{background:var(--g200);opacity:.3}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:16px;border:1px solid var(--g200);padding:1.5rem;width:320px;max-width:92vw;box-shadow:0 12px 48px rgba(0,0,0,.22);animation:slideUp .18s ease}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem}
.modal-title{font-size:15px;font-weight:600}
.modal-sub{font-size:11px;color:var(--g400);margin-top:2px}
.modal-x{background:none;border:none;cursor:pointer;color:var(--g400);font-size:18px;line-height:1;transition:color .15s}
.modal-x:hover{color:var(--black)}
.chatter-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:1rem}
.ch-btn{padding:9px 6px;border-radius:8px;border:none;cursor:pointer;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;color:var(--white);text-align:center;transition:transform .1s,opacity .1s}
.ch-btn:hover{transform:scale(.96);opacity:.88}
.ch-btn.clear{background:var(--g100);color:var(--g600);grid-column:1/-1;font-family:'DM Sans',sans-serif;font-weight:500;border:1px solid var(--g200);font-size:12px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding-top:.75rem;border-top:1px solid var(--g100);margin-top:.25rem}
.form-row{margin-bottom:.875rem}
.form-lbl{font-size:10px;font-weight:600;color:var(--g400);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;display:block}
.form-input{width:100%;padding:8px 12px;border:1px solid var(--g200);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;color:var(--black);background:var(--white)}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,161,242,.12)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s}
.swatch:hover{transform:scale(1.15)}
.swatch.sel{border-color:var(--black);transform:scale(1.1)}
.preview-pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;color:var(--white);letter-spacing:.04em;margin-top:8px}
.repeat-info{font-size:12px;font-weight:600;margin-bottom:.75rem;color:var(--g600);padding:8px 12px;background:var(--g50);border-radius:8px}
.repeat-days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.rd-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--g200);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;background:var(--white);color:var(--g600)}
.rd-btn.active{background:var(--blue);color:var(--white);border-color:var(--blue)}
.rd-btn.today{opacity:.6;cursor:default}
.loading-overlay{position:fixed;inset:0;background:var(--black);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-logo{width:64px;height:64px;object-fit:contain}
.loading-text{color:rgba(255,255,255,.5);font-size:12px;font-family:'DM Mono',monospace;letter-spacing:.1em}
.loading-bar{width:160px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.loading-bar-inner{height:100%;background:var(--blue);border-radius:2px;animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
</style>
</head>

  </div>
  <div class="sync-status"><div class="sync-dot" id="syncDot"></div><span id="syncText">Verbinde...</span></div>
</div>
<div class="toolbar">
  <div class="day-nav">
    <button id="prevDay">&#8592;</button>
    <span class="day-label" id="dayLabel"></span>
    <button id="nextDay">&#8594;</button>
  </div>
  <button class="btn" id="todayBtn">Heute</button>
  <button class="btn btn-dark" id="weekViewBtn">Wochenansicht</button>
  <button class="btn ml-auto" id="addChatterBtn">+ Betreuer</button>
  <button class="btn" id="addProfileBtn">+ Kid</button>
  <button class="btn btn-primary" id="exportBtn">Export CSV</button>
</div>
<div class="hint">Maus ziehen = Zeitraum &amp; mehrere Kids markieren &nbsp;|&nbsp; &#10006; = entfernen</div>
<div class="stats-bar" id="statsBar"></div>
<div class="table-wrap"><table class="plan-table" id="mainTable"></table></div>
<div class="legend-bar"><span class="legend-lbl">Betreuer</span><div id="legend" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-hd"><div><div class="modal-title" id="mTitle"></div><div class="modal-sub" id="mSub"></div></div><button class="modal-x" id="closeModalBtn">&#10005;</button></div>
    <div class="chatter-grid" id="chatterGrid"></div>
    <div class="modal-foot"><button class="btn" id="cancelModalBtn">Abbrechen</button></div>
  </div>
</div>
<div class="modal-bg" id="repeatModal">
  <div class="modal">
    <div class="modal-hd"><div><div class="modal-title">Weitere Tage?</div><div class="modal-sub">Tage anklicken um denselben Betreuer einzutragen</div></div><button class="modal-x" id="closeRepeatBtn">&#10005;</button></div>
    <div class="repeat-info" id="repeatInfo"></div>
    <div class="repeat-days" id="repeatDays"></div>
    <div class="modal-foot">
      <button class="btn" id="onlyTodayBtn">Nur heute</button>
      <button class="btn btn-primary" id="applyRepeatBtn">Speichern</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="addChatterModal">
  <div class="modal">
    <div class="modal-hd"><div class="modal-title">Kid hinzufuegen</div><button class="modal-x" id="closeAddChatterBtn">&#10005;</button></div>
    <div class="form-row" style="margin-top:.5rem"><label class="form-lbl">Name</label><input class="form-input" id="newChatterName" placeholder="z.B. Lisa" maxlength="20"/></div>
    <div class="form-row"><label class="form-lbl">Farbe</label><div class="swatches" id="colorSwatches"></div><div id="colorPreview" class="preview-pill">Vorschau</div></div>
    <div class="modal-foot"><button class="btn" id="cancelAddChatterBtn">Abbrechen</button><button class="btn btn-primary" id="saveChatterBtn">Hinzufuegen</button></div>
  </div>
</div>
<div class="modal-bg" id="addProfileModal">
  <div class="modal">
    <div class="modal-hd"><div class="modal-title">Kid hinzufuegen</div><button class="modal-x" id="closeAddProfileBtn">&#10005;</button></div>
    <div class="form-row" style="margin-top:.5rem"><label class="form-lbl">Name</label><input class="form-input" id="newProfileName" placeholder="z.B. Paulina" maxlength="24"/></div>
    <div class="modal-foot"><button class="btn" id="cancelAddProfileBtn">Abbrechen</button><button class="btn btn-primary" id="saveProfileBtn">Hinzufuegen</button></div>
  </div>
</div>

<script>

var DAYS = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
var DAYS_S = ["Mo","Di","Mi","Do","Fr","Sa","So"];
var HOURS = [];
for(var i=0;i<24;i++) HOURS.push((i<10?"0":"")+i+":00");
var COLORS = ["#1da1f2","#e53935","#8e24aa","#00897b","#f4511e","#6d4c41","#0097a7","#c0ca33","#fb8c00","#43a047","#546e7a","#d81b60"];
var FB = "https://nakama-schichtplan-default-rtdb.firebaseio.com/kleine_helden_v1.json";

var dayOffset = 0;
var weekViewOffset = 0;
var viewMode = "day";
var profiles = ["Moni","Jaron","Mike","Levin","Michael"];
var chatters = [
  {name:"Nadine",color:"#1da1f2"},{name:"David",color:"#43a047"},
  {name:"Genakan",color:"#e53935"},{name:"Paulina",color:"#8e24aa"},
  {name:"Jessie",color:"#fb8c00"}
];
var slots = {};
var selColor = COLORS[0];
var lastHash = "";
var dragActive=false, dragPiStart=-1, dragPiEnd=-1, dragHiStart=-1, dragHiEnd=-1;
var pendingCell=null, pendingRepeat=null;

function getMonday(){
  var d=new Date(), wd=d.getDay();
  var m=new Date(d); m.setDate(d.getDate()-(wd===0?6:wd-1)); m.setHours(0,0,0,0); return m;
}
function offToDate(off){
  var m=getMonday(), r=new Date(m); r.setDate(m.getDate()+off); return r;
}
function todayOff(){
  var wd=new Date().getDay(); return (wd===0?6:wd-1);
}

function sk(p,h,o){ return "d"+o+"|"+p+"|"+h; }
function getSlot(p,h,o){ return slots[sk(p,h,o)]||""; }
function setSlot(p,h,v,o){ var k=sk(p,h,o); if(v==="")delete slots[k]; else slots[k]=v; }

function setSyncStatus(s,t){
  var dot=document.getElementById("syncDot"), el=document.getElementById("syncText");
  if(!dot||!el)return;
  dot.className="sync-dot"+(s==="syncing"?" syncing":s==="error"?" error":"");
  el.textContent=t;
}
function saveLocal(){ try{localStorage.setItem("kleine_helden_v1",JSON.stringify({slots:slots,profiles:profiles,chatters:chatters}));}catch(e){} }
function loadLocal(){ try{ var r=localStorage.getItem("kleine_helden_v1"); if(r){var d=JSON.parse(r);if(d.slots)slots=d.slots;if(d.profiles&&d.profiles.length)profiles=d.profiles;if(d.chatters&&d.chatters.length)chatters=d.chatters;} }catch(e){} }
function push(){
  setSyncStatus("syncing","Speichern...");
  var body=JSON.stringify({slots:slots,profiles:profiles,chatters:chatters,ts:Date.now()});
  var x=new XMLHttpRequest(); x.open("PUT",FB,true); x.setRequestHeader("Content-Type","application/json");
  x.onreadystatechange=function(){ if(x.readyState===4){ if(x.status>=200&&x.status<300){lastHash=body.length+"";setSyncStatus("ok","Gespeichert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));}else setSyncStatus("error","Fehler "+x.status); }};
  x.send(body);
}
function pull(){
  var x=new XMLHttpRequest(); x.open("GET",FB,true);
  x.onreadystatechange=function(){
    if(x.readyState===4&&x.status===200&&x.responseText&&x.responseText!=="null"){
      try{ var h=x.responseText.length+""; if(h!==lastHash){lastHash=h;var d=JSON.parse(x.responseText);if(d.slots)slots=d.slots;if(d.profiles&&d.profiles.length)profiles=d.profiles;if(d.chatters&&d.chatters.length)chatters=d.chatters;saveLocal();render();setSyncStatus("ok","Synchronisiert "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));} }catch(e){setSyncStatus("error","Fehler");}
    }
  }; x.send();
}
function syncAndRender(){ saveLocal(); render(); push(); }
function findCh(name){ for(var i=0;i<chatters.length;i++) if(chatters[i].name===name) return chatters[i]; return null; }

function render(){ if(viewMode==="week") renderWeek(); else renderDay(); }

function renderStats(tot,ua){
  document.getElementById("statsBar").innerHTML=
    "<div class='stat'><div class='stat-num'>"+profiles.length+"</div><div class='stat-lbl'>Kids</div></div>"+
    "<div class='stat'><div class='stat-num'>"+chatters.length+"</div><div class='stat-lbl'>Betreuer</div></div>"+
    "<div class='stat'><div class='stat-num'>"+tot+"</div><div class='stat-lbl'>Slots</div></div>"+
    "<div class='stat'><div class='stat-num'>"+Object.keys(ua).length+"</div><div class='stat-lbl'>Im Einsatz</div></div>";
}
function renderLegend(){
  var h="";
  for(var i=0;i<chatters.length;i++)
    h+="<span class='leg'><span class='leg-dot' style='background:"+chatters[i].color+"'></span>"+chatters[i].name+"<span class='leg-del' data-ci='"+i+"'>&#10005;</span></span>";
  document.getElementById("legend").innerHTML=h;
  var dels=document.querySelectorAll(".leg-del");
  for(var j=0;j<dels.length;j++){
    dels[j].addEventListener("click",function(){
      var ci=parseInt(this.getAttribute("data-ci"));
      if(confirm("Entfernen?")){chatters.splice(ci,1);syncAndRender();}
    });
  }
}

function renderDay(){
  var d=offToDate(dayOffset);
  var wi=((dayOffset%7)+7)%7;
  document.getElementById("dayLabel").textContent=DAYS[wi]+", "+d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  var piMin=Math.min(dragPiStart,dragPiEnd), piMax=Math.max(dragPiStart,dragPiEnd);
  var hiMin2=Math.min(dragHiStart,dragHiEnd), hiMax2=Math.max(dragHiStart,dragHiEnd);
  var thead="<thead><tr><th class='th-name'>KIDS</th>";
  for(var hi=0;hi<24;hi++) thead+="<th>"+HOURS[hi]+"</th>";
  thead+="<th class='th-del'>&#10006;</th><th class='th-sum'>&#8721;</th></tr></thead>";
  var tot=0,ua={},tbody="<tbody>";
  for(var pi=0;pi<profiles.length;pi++){
    var prof=profiles[pi], sum=0;
    tbody+="<tr"+(pi%2===1?" class='row-alt'":"")+">";
    tbody+="<td class='td-name'>"+prof+"</td>";
    for(var hi2=0;hi2<24;hi2++){
      var s=getSlot(prof,hi2,dayOffset);
      if(s){sum++;tot++;ua[s]=1;}
      var ch=findCh(s);
      var hl=dragActive&&pi>=piMin&&pi<=piMax&&hi2>=hiMin2&&hi2<=hiMax2;
      tbody+="<td class='td-slot"+(hl?" drag-hl":"")+"' data-pi='"+pi+"' data-hi='"+hi2+"'>";
      if(ch) tbody+="<div class='slot-wrap'><div class='slot-chip' style='background:"+ch.color+"'>"+s+"</div></div>";
      else   tbody+="<div class='slot-wrap'><div class='slot-empty'></div></div>";
      tbody+="</td>";
    }
    tbody+="<td class='td-del' data-pi='"+pi+"'>&#10006;</td>";
    tbody+="<td class='td-sum'>"+(sum>0?sum:"&#8211;")+"</td></tr>";
  }
  tbody+="</tbody>";
  document.getElementById("mainTable").innerHTML=thead+tbody;
  var cells=document.querySelectorAll(".td-slot");
  for(var k=0;k<cells.length;k++){
    cells[k].addEventListener("mousedown",onMD);
    cells[k].addEventListener("mouseenter",onME);
  }
  document.getElementById("mainTable").addEventListener("mouseup",onMU);
  var dels=document.querySelectorAll(".td-del");
  for(var m=0;m<dels.length;m++){
    dels[m].addEventListener("click",function(){
      var pi=parseInt(this.getAttribute("data-pi"));
      if(confirm("Entfernen?")){profiles.splice(pi,1);syncAndRender();}
    });
  }
  renderStats(tot,ua); renderLegend();
}

function onMD(e){
  if(e.button!==0)return; e.preventDefault();
  dragActive=true;
  dragPiStart=dragPiEnd=parseInt(this.getAttribute("data-pi"));
  dragHiStart=dragHiEnd=parseInt(this.getAttribute("data-hi"));
  render();
}
function onME(){
  if(!dragActive)return;
  dragPiEnd=parseInt(this.getAttribute("data-pi"));
  dragHiEnd=parseInt(this.getAttribute("data-hi"));
  render();
}
function onMU(){
  if(!dragActive)return;
  var piMin=Math.min(dragPiStart,dragPiEnd), piMax=Math.max(dragPiStart,dragPiEnd);
  var hiMin=Math.min(dragHiStart,dragHiEnd), hiMax=Math.max(dragHiStart,dragHiEnd);
  dragActive=false; dragPiStart=dragPiEnd=dragHiStart=dragHiEnd=-1;
  openChatterModal(piMin,piMax,hiMin,hiMax);
}
document.addEventListener("mouseup",function(){ if(dragActive){dragActive=false;dragPiStart=dragPiEnd=dragHiStart=dragHiEnd=-1;render();} });

function openChatterModal(piMin,piMax,hiMin,hiMax){
  var pis=[]; for(var i=piMin;i<=piMax;i++) pis.push(i);
  pendingCell={pis:pis,hiMin:hiMin,hiMax:hiMax};
  var pl=pis.length===1?profiles[piMin]:profiles[piMin]+" + "+(pis.length-1)+" weitere";
  document.getElementById("mTitle").textContent=pl;
  document.getElementById("mSub").textContent=HOURS[hiMin]+(hiMin!==hiMax?" – "+HOURS[hiMax]:"")+' Uhr · '+pis.length+(pis.length===1?" Kid":" Kids");
  var h="";
  for(var i=0;i<chatters.length;i++) h+="<button class='ch-btn' style='background:"+chatters[i].color+"' data-name='"+chatters[i].name+"'>"+chatters[i].name+"</button>";
  h+="<button class='ch-btn clear' data-name=''>Leeren</button>";
  document.getElementById("chatterGrid").innerHTML=h;
  var btns=document.querySelectorAll(".ch-btn");
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",onChPick);
  document.getElementById("modalBg").classList.add("open");
}
function onChPick(){
  if(!pendingCell)return;
  var name=this.getAttribute("data-name");
  var pis=pendingCell.pis, hiMin=pendingCell.hiMin, hiMax=pendingCell.hiMax;
  for(var p=0;p<pis.length;p++) for(var hi=hiMin;hi<=hiMax;hi++) setSlot(profiles[pis[p]],hi,name,dayOffset);
  closeChModal();
  if(name!==""){
    pendingRepeat={pis:pis,hiMin:hiMin,hiMax:hiMax,chName:name,baseOff:dayOffset};
    openRepeatModal();
  } else { syncAndRender(); }
}
function closeChModal(){ document.getElementById("modalBg").classList.remove("open"); pendingCell=null; }

function openRepeatModal(){
  var pr=pendingRepeat;
  var pn=[]; for(var k=0;k<pr.pis.length;k++) pn.push(profiles[pr.pis[k]]);
  document.getElementById("repeatInfo").textContent=pn.join(", ")+" · "+HOURS[pr.hiMin]+(pr.hiMin!==pr.hiMax?" – "+HOURS[pr.hiMax]:"")+' Uhr';
  var weekStart=Math.floor(pr.baseOff/7)*7;
  var h="";
  for(var i=0;i<7;i++){
    var off=weekStart+i, isToday=(off===pr.baseOff);
    h+="<div class='rd-btn"+(isToday?" today active":"")+"' data-off='"+off+"' data-active='"+(isToday?"1":"0")+"'>"+DAYS_S[i]+"</div>";
  }
  document.getElementById("repeatDays").innerHTML=h;
  var btns=document.querySelectorAll(".rd-btn:not(.today)");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var a=this.getAttribute("data-active")==="1";
      this.setAttribute("data-active",a?"0":"1");
      this.classList.toggle("active",!a);
    });
  }
  document.getElementById("repeatModal").classList.add("open");
}
function closeRepeatModal(){ document.getElementById("repeatModal").classList.remove("open"); pendingRepeat=null; }
function applyRepeat(){
  var pr=pendingRepeat;
  var btns=document.querySelectorAll(".rd-btn");
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute("data-active")!=="1") continue;
    var off=parseInt(btns[i].getAttribute("data-off"));
    for(var p=0;p<pr.pis.length;p++) for(var hi=pr.hiMin;hi<=pr.hiMax;hi++) setSlot(profiles[pr.pis[p]],hi,pr.chName,off);
  }
  closeRepeatModal(); syncAndRender();
}

function renderWeek(){
  var base=weekViewOffset*7, offs=[];
  for(var i=0;i<7;i++) offs.push(base+i);
  var mon=offToDate(offs[0]), sun=offToDate(offs[6]);
  var fmt=function(d){return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});};
  document.getElementById("dayLabel").textContent=fmt(mon)+" (Mo) – "+fmt(sun)+" (So)";
  var td=todayOff();
  var html="<div class='week-grid'>";
  for(var di=0;di<7;di++){
    var off=offs[di], isToday=(off===td&&weekViewOffset===0);
    html+="<div class='week-col"+(isToday?" week-col-today":"")+"'>";
    html+="<div class='week-col-hd'><div class='week-col-day'>"+DAYS_S[di]+"</div><div class='week-col-date'>"+fmt(offToDate(off))+"</div></div>";
    for(var pi=0;pi<profiles.length;pi++){
      html+="<div class='week-prof-block'><div class='week-prof-name'>"+profiles[pi]+"</div><div class='week-hours'>";
      for(var hi=0;hi<24;hi++){
        var s=getSlot(profiles[pi],hi,off), ch=findCh(s);
        if(ch) html+="<div class='wh filled' style='background:"+ch.color+"' title='"+HOURS[hi]+" – "+s+"'></div>";
        else   html+="<div class='wh empty'></div>";
      }
      html+="</div></div>";
    }
    html+="</div>";
  }
  html+="</div>";
  document.getElementById("mainTable").innerHTML="<tbody><tr><td style='padding:0;border:none'>"+html+"</td></tr></tbody>";
  var tot=0,ua={};
  for(var pi2=0;pi2<profiles.length;pi2++) for(var di2=0;di2<7;di2++) for(var hi2=0;hi2<24;hi2++){var sv=getSlot(profiles[pi2],hi2,offs[di2]);if(sv){tot++;ua[sv]=1;}}
  renderStats(tot,ua); renderLegend();
}

function openAddChatter(){ document.getElementById("newChatterName").value=""; selColor=COLORS[0]; renderSwatches(); document.getElementById("addChatterModal").classList.add("open"); }
function closeAddChatter(){ document.getElementById("addChatterModal").classList.remove("open"); }
function renderSwatches(){
  var h="";
  for(var i=0;i<COLORS.length;i++) h+="<div class='swatch"+(COLORS[i]===selColor?" sel":"")+"' style='background:"+COLORS[i]+"' data-c='"+COLORS[i]+"'></div>";
  document.getElementById("colorSwatches").innerHTML=h;
  var sw=document.querySelectorAll(".swatch");
  for(var j=0;j<sw.length;j++) sw[j].addEventListener("click",function(){selColor=this.getAttribute("data-c");renderSwatches();});
  updatePreview();
}
function updatePreview(){ var el=document.getElementById("colorPreview"); el.style.background=selColor; el.textContent=document.getElementById("newChatterName").value||"Vorschau"; }
function saveChatter(){
  var n=document.getElementById("newChatterName").value.trim(); if(!n)return;
  for(var i=0;i<chatters.length;i++) if(chatters[i].name===n)return;
  chatters.push({name:n,color:selColor}); closeAddChatter(); syncAndRender();
}
function openAddProfile(){ document.getElementById("newProfileName").value=""; document.getElementById("addProfileModal").classList.add("open"); }
function closeAddProfile(){ document.getElementById("addProfileModal").classList.remove("open"); }
function saveProfile(){
  var n=document.getElementById("newProfileName").value.trim(); if(!n)return;
  for(var i=0;i<profiles.length;i++) if(profiles[i]===n)return;
  profiles.push(n); closeAddProfile(); syncAndRender();
}

function exportCSV(){
  var csv="",blob,url,a;
  if(viewMode==="week"){
    var base2=weekViewOffset*7, offs2=[];
    for(var i=0;i<7;i++) offs2.push(base2+i);
    csv="Profil";
    for(var di3=0;di3<7;di3++) csv+=","+DAYS[di3];
    csv+=",Summe\n";
    for(var pi3=0;pi3<profiles.length;pi3++){
      csv+=profiles[pi3]; var sum3=0;
      for(var di4=0;di4<7;di4++){
        var names=[]; for(var hi3=0;hi3<24;hi3++){var sv3=getSlot(profiles[pi3],hi3,offs2[di4]);if(sv3){if(names.indexOf(sv3)===-1)names.push(sv3);sum3++;}}
        csv+=","+(names.join("+")||"");
      }
      csv+=","+sum3+"\n";
    }
  } else {
    csv="Profil"; for(var h4=0;h4<24;h4++) csv+=","+HOURS[h4]; csv+=",Summe\n";
    for(var pi4=0;pi4<profiles.length;pi4++){
      csv+=profiles[pi4]; var sum4=0;
      for(var hi4=0;hi4<24;hi4++){var sv4=getSlot(profiles[pi4],hi4,dayOffset);if(sv4)sum4++;csv+=","+(sv4||"");}
      csv+=","+sum4+"\n";
    }
  }
  blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  url=URL.createObjectURL(blob); a=document.createElement("a"); a.href=url; a.download="schichtplan.csv"; a.click(); URL.revokeObjectURL(url);
}

document.getElementById("prevDay").addEventListener("click",function(){if(viewMode==="week")weekViewOffset--;else dayOffset--;render();});
document.getElementById("nextDay").addEventListener("click",function(){if(viewMode==="week")weekViewOffset++;else dayOffset++;render();});
document.getElementById("todayBtn").addEventListener("click",function(){dayOffset=todayOff();weekViewOffset=0;render();});
document.getElementById("weekViewBtn").addEventListener("click",function(){viewMode=viewMode==="week"?"day":"week";this.textContent=viewMode==="week"?"Tagesansicht":"Wochenansicht";render();});
document.getElementById("addChatterBtn").addEventListener("click",openAddChatter);
document.getElementById("addProfileBtn").addEventListener("click",openAddProfile);
document.getElementById("exportBtn").addEventListener("click",exportCSV);
document.getElementById("closeModalBtn").addEventListener("click",closeChModal);
document.getElementById("cancelModalBtn").addEventListener("click",closeChModal);
document.getElementById("closeRepeatBtn").addEventListener("click",function(){closeRepeatModal();syncAndRender();});
document.getElementById("onlyTodayBtn").addEventListener("click",function(){closeRepeatModal();syncAndRender();});
document.getElementById("applyRepeatBtn").addEventListener("click",applyRepeat);
document.getElementById("closeAddChatterBtn").addEventListener("click",closeAddChatter);
document.getElementById("cancelAddChatterBtn").addEventListener("click",closeAddChatter);
document.getElementById("saveChatterBtn").addEventListener("click",saveChatter);
document.getElementById("closeAddProfileBtn").addEventListener("click",closeAddProfile);
document.getElementById("cancelAddProfileBtn").addEventListener("click",closeAddProfile);
document.getElementById("saveProfileBtn").addEventListener("click",saveProfile);
document.getElementById("newChatterName").addEventListener("input",updatePreview);
document.getElementById("modalBg").addEventListener("click",function(e){if(e.target===this)closeChModal();});
document.getElementById("repeatModal").addEventListener("click",function(e){if(e.target===this){closeRepeatModal();syncAndRender();}});
document.getElementById("addChatterModal").addEventListener("click",function(e){if(e.target===this)closeAddChatter();});
document.getElementById("addProfileModal").addEventListener("click",function(e){if(e.target===this)closeAddProfile();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeChModal();closeAddChatter();closeAddProfile();closeRepeatModal();syncAndRender();}});

dayOffset=todayOff();
loadLocal(); render();
var ov=document.getElementById("loadingOverlay");
pull();
setTimeout(function(){ov.classList.add("hidden");setTimeout(function(){ov.style.display="none";},400);},1200);
setInterval(pull,10000);

</script>
</body>
</html>
